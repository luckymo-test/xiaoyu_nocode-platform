name: xiaoyu-zerocode

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaoyu_zerocode}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-p${MYSQL_ROOT_PASSWORD:-local-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xiaoyu_zerocode}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      SPRING_DATA_REDIS_HOST: redis
      CODEGEN_JOB_EXECUTION_MODE: api
      CODEGEN_SPRING_SECURITY_ENABLED: "true"
      CODEGEN_CSRF_ENABLED: "true"
      CODEGEN_CORS_ORIGIN_LOCAL: http://localhost:8080
      CODEGEN_CORS_ORIGIN_IP: http://127.0.0.1:8080
      CODEGEN_TMP_ROOT: /workspace
      CODEGEN_DEPLOY_ROOT: /deploy
      CODEGEN_PREVIEW_SIGNING_SECRET: ${PREVIEW_SIGNING_SECRET:-local-preview-secret-change-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8124:8124"
      - "8125:8125"
    volumes:
      - workspace:/workspace
      - deploy:/deploy

  generation-worker:
    build:
      context: .
      dockerfile: sandbox-runtime/Dockerfile.generation-worker
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xiaoyu_zerocode}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      SPRING_DATA_REDIS_HOST: redis
      CODEGEN_JOB_EXECUTION_MODE: worker
      CODEGEN_SANDBOX_REQUIRE_CONTAINER: "true"
      CODEGEN_PLAYWRIGHT_TRANSPORT: redis
      CODEGEN_PLAYWRIGHT_WORKER_URL: http://browser-worker:8090
      CODEGEN_TMP_ROOT: /workspace
      CODEGEN_DEPLOY_ROOT: /deploy
      CODEGEN_DOMAIN: http://localhost:8088/apps
      CODEGEN_PREVIEW_SIGNING_SECRET: ${PREVIEW_SIGNING_SECRET:-local-preview-secret-change-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
    volumes:
      - workspace:/workspace
      - deploy:/deploy
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser-worker:
        condition: service_healthy

  browser-worker:
    build:
      context: .
      dockerfile: sandbox-runtime/Dockerfile.browser-worker
    environment:
      BROWSER_WORKER_REDIS_URL: redis://redis:6379
      BROWSER_WORKER_PROXY_SERVER: http://egress-proxy:3128
      BROWSER_WORKER_PROXY_BYPASS: 127.0.0.1,localhost,api
      BROWSER_WORKER_WORKSPACE_ROOT: /workspace
      BROWSER_WORKER_REQUIRE_CONTAINER: "true"
      BROWSER_WORKER_REQUIRE_PROXY: "true"
    volumes:
      - workspace:/workspace:rw
    networks:
      - default
      - sandbox-internal
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    shm_size: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      egress-proxy:
        condition: service_started

  egress-proxy:
    image: ubuntu/squid:6.10-24.04_beta
    volumes:
      - ./sandbox-runtime/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - sandbox-egress
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/spool/squid:rw,nosuid,nodev,size=64m
      - /var/run:rw,nosuid,nodev,size=8m

  preview-gateway:
    image: node:22.14.0-bookworm-slim
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PREVIEW_GATEWAY_PORT: "8088"
      PREVIEW_WORKSPACE_ROOT: /workspace
      PREVIEW_DEPLOY_ROOT: /deploy
      PREVIEW_API_ORIGIN: http://api:8124
      PREVIEW_SIGNING_SECRET: ${PREVIEW_SIGNING_SECRET:-local-preview-secret-change-me}
    volumes:
      - ./preview-gateway:/app:ro
      - workspace:/workspace:ro
      - deploy:/deploy:ro
    ports:
      - "8088:8088"
    depends_on:
      api:
        condition: service_started

  frontend:
    build:
      context: ./xiaoyuZeroCode-front
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

volumes:
  mysql-data:
  workspace:
  deploy:

networks:
  sandbox-internal:
    internal: true
  sandbox-egress: {}
