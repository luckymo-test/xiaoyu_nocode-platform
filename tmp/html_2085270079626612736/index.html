<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4A6CF7;
            --primary-hover: #3A5BD9;
            --bg-gradient-start: #f0f4ff;
            --bg-gradient-end: #e0e7ff;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --error-color: #dc2626;
            --success-color: #16a34a;
            --border-color: #d1d5db;
            --input-bg: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --radius: 12px;
            --transition: all 0.3s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: var(--input-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header .icon {
            font-size: 50px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }
        .login-header h1 {
            font-size: 28px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
            transition: var(--transition);
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            color: var(--text-primary);
            background: #f9fafb;
            transition: var(--transition);
            outline: none;
        }
        .input-wrapper input:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(74,108,247,0.15);
        }
        .input-wrapper input:focus + i {
            color: var(--primary-color);
        }
        .input-wrapper input.error {
            border-color: var(--error-color);
        }
        .input-wrapper input.success {
            border-color: var(--success-color);
        }
        .error-message {
            display: block;
            font-size: 12px;
            color: var(--error-color);
            margin-top: 5px;
            min-height: 16px;
        }
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }
        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74,108,247,0.3);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login:focus-visible {
            outline: 3px solid rgba(74,108,247,0.5);
            outline-offset: 2px;
        }
        .btn-login i.spinner {
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        .login-footer a:hover {
            text-decoration: underline;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--text-primary);
            color: #fff;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 14px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateX(120%);
            transition: transform 0.4s ease;
            z-index: 1000;
            max-width: 300px;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast.success {
            background: var(--success-color);
        }
        .toast.error {
            background: var(--error-color);
        }
        @media (max-width: 768px) {
            .login-container {
                padding: 30px 20px;
                max-width: 100%;
            }
            .login-header h1 {
                font-size: 24px;
            }
        }
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .login-container {
                padding: 25px 15px;
            }
            .btn-login {
                font-size: 15px;
                padding: 13px;
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <div class="login-header">
            <i class="fas fa-user-circle icon" aria-hidden="true"></i>
            <h1>欢迎登录</h1>
            <p>请输入您的账号信息</p>
        </div>
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="username">用户名或邮箱</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" placeholder="请输入用户名或邮箱" autocomplete="username" required aria-required="true" aria-describedby="usernameError">
                    <i class="fas fa-user" aria-hidden="true"></i>
                </div>
                <span id="usernameError" class="error-message" aria-live="polite"></span>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required aria-required="true" aria-describedby="passwordError">
                    <i class="fas fa-lock" aria-hidden="true"></i>
                </div>
                <span id="passwordError" class="error-message" aria-live="polite"></span>
            </div>
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <span>记住我</span>
                </label>
                <a href="#" class="forgot-password" tabindex="0">忘记密码？</a>
            </div>
            <button type="submit" class="btn-login" id="loginButton">
                <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
                <span class="btn-text">登 录</span>
            </button>
        </form>
        <div class="login-footer">
            还没有账号？<a href="#" tabindex="0">立即注册</a>
        </div>
    </main>
    <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

    <script>
        (function() {
            'use strict';
            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');
            const loginButton = document.getElementById('loginButton');
            const toast = document.getElementById('toast');
            const rememberCheckbox = document.getElementById('remember');

            // 从 localStorage 加载记住的用户名
            function loadSavedUsername() {
                const saved = localStorage.getItem('rememberedUsername');
                if (saved) {
                    usernameInput.value = saved;
                    rememberCheckbox.checked = true;
                }
            }

            // 显示提示消息
            function showToast(message, type = 'info') {
                toast.textContent = message;
                toast.className = 'toast show ' + type;
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // 验证用户名
            function validateUsername() {
                const value = usernameInput.value.trim();
                if (!value) {
                    usernameError.textContent = '请输入用户名或邮箱';
                    usernameInput.classList.add('error');
                    usernameInput.classList.remove('success');
                    return false;
                }
                if (value.length < 3) {
                    usernameError.textContent = '用户名至少3个字符';
                    usernameInput.classList.add('error');
                    usernameInput.classList.remove('success');
                    return false;
                }
                // 简单的邮箱格式检查（如果包含@）
                if (value.includes('@')) {
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(value)) {
                        usernameError.textContent = '邮箱格式不正确';
                        usernameInput.classList.add('error');
                        usernameInput.classList.remove('success');
                        return false;
                    }
                }
                usernameError.textContent = '';
                usernameInput.classList.remove('error');
                usernameInput.classList.add('success');
                return true;
            }

            // 验证密码
            function validatePassword() {
                const value = passwordInput.value;
                if (!value) {
                    passwordError.textContent = '请输入密码';
                    passwordInput.classList.add('error');
                    passwordInput.classList.remove('success');
                    return false;
                }
                if (value.length < 6) {
                    passwordError.textContent = '密码至少6个字符';
                    passwordInput.classList.add('error');
                    passwordInput.classList.remove('success');
                    return false;
                }
                passwordError.textContent = '';
                passwordInput.classList.remove('error');
                passwordInput.classList.add('success');
                return true;
            }

            // 实时验证事件
            usernameInput.addEventListener('blur', validateUsername);
            passwordInput.addEventListener('blur', validatePassword);
            usernameInput.addEventListener('input', function() {
                if (this.classList.contains('error')) validateUsername();
            });
            passwordInput.addEventListener('input', function() {
                if (this.classList.contains('error')) validatePassword();
            });

            // 模拟登录请求
            async function mockLoginRequest(username, password) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        // 模拟验证（演示用：密码为 admin123 或 123456 时成功）
                        if (password === 'admin123' || password === '123456') {
                            resolve({ success: true });
                        } else {
                            reject(new Error('密码错误'));
                        }
                    }, 1500);
                });
            }

            // 表单提交处理
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const isUsernameValid = validateUsername();
                const isPasswordValid = validatePassword();
                if (!isUsernameValid || !isPasswordValid) {
                    showToast('请检查表单填写内容', 'error');
                    return;
                }

                // 保存记住的用户名
                if (rememberCheckbox.checked) {
                    localStorage.setItem('rememberedUsername', usernameInput.value.trim());
                } else {
                    localStorage.removeItem('rememberedUsername');
                }

                // 禁用按钮，显示加载状态
                loginButton.disabled = true;
                const originalHTML = loginButton.innerHTML;
                loginButton.innerHTML = '<i class="fas fa-spinner spinner"></i><span>登录中...</span>';

                try {
                    const result = await mockLoginRequest(usernameInput.value.trim(), passwordInput.value);
                    if (result.success) {
                        showToast('登录成功！欢迎回来', 'success');
                        // 演示：登录成功后重置表单
                        setTimeout(() => {
                            form.reset();
                            // 清除成功状态
                            usernameInput.classList.remove('success');
                            passwordInput.classList.remove('success');
                        }, 1000);
                    }
                } catch (error) {
                    showToast(error.message || '登录失败，请重试', 'error');
                    passwordInput.value = '';
                    passwordInput.classList.add('error');
                    passwordError.textContent = '密码错误';
                } finally {
                    loginButton.disabled = false;
                    loginButton.innerHTML = originalHTML;
                }
            });

            // 加载保存的用户名
            loadSavedUsername();
        })();
    </script>
</body>
</html>
