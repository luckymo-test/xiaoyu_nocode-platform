name: xiaoyu-sandbox

services:
  browser-worker:
    image: ${BROWSER_WORKER_IMAGE:-xiaoyu/browser-worker:1.0.0}
    build:
      context: ..
      dockerfile: sandbox-runtime/Dockerfile.browser-worker
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    shm_size: 512m
    stop_grace_period: 15s
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    environment:
      BROWSER_WORKER_REDIS_URL: redis://sandbox-redis:6379
      BROWSER_WORKER_PROXY_SERVER: http://egress-proxy:3128
      BROWSER_WORKER_PROXY_BYPASS: 127.0.0.1,localhost
      BROWSER_WORKER_SETTLE_MILLIS: "1200"
    volumes:
      - "${SANDBOX_WORKSPACE_ROOT:?请设置 SANDBOX_WORKSPACE_ROOT}:/workspace:rw"
    networks:
      - sandbox-internal
    depends_on:
      egress-proxy:
        condition: service_started
      sandbox-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  egress-proxy:
    image: ${SQUID_IMAGE:-ubuntu/squid:6.10-24.04_beta}
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /var/spool/squid:rw,nosuid,nodev,size=64m
      - /var/run:rw,nosuid,nodev,size=8m
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
    networks:
      - sandbox-internal
      - sandbox-egress

  sandbox-redis:
    image: ${SANDBOX_REDIS_IMAGE:-redis:7.4.2-alpine}
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 192m
    cpus: 0.5
    tmpfs:
      - /data:rw,nosuid,nodev,size=16m
    networks:
      - sandbox-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6

networks:
  sandbox-internal:
    internal: true
  sandbox-egress: {}
