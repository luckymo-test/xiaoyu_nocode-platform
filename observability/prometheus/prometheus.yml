# Prometheus 抓取配置：抓取后端 actuator 指标端点
# 后端指标走独立端口 8125（management.server.port），无 context-path，路径 /actuator/prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: xiaoyu-zerocode
    metrics_path: /actuator/prometheus
    static_configs:
      # 容器访问宿主机；Linux 下需 compose 里的 host-gateway（已配）
      - targets: ["host.docker.internal:8125"]
        labels:
          app: xiaoyu-zerocode
