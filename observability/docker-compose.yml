# Prometheus + Grafana 本地编排（AI 调用可观测性）
# 用法：cd observability && docker compose up -d
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000 (admin / 默认 admin，见下方环境变量)
# 前置：本机已安装 Docker；后端在宿主机 8124 业务端口、8125 指标端口运行
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: xiaoyu-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # 让容器能用 host.docker.internal 访问宿主机（Linux 需要 host-gateway）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: xiaoyu-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # 供 datasources.yml 里的 MySQL 数据源引用（避免把密码写进仓库）
      GF_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mofanyi824}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
    restart: unless-stopped
