spring:
  application:
    name: xiaoyuZeroCode
  profiles:
    active: location
  # 数据库迁移（plan-refactor 6.4）：脚本在 classpath:db/migration，已有库用 baseline 接入
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有库（表已建好）首次接入时不报"非空 schema"，从 0 基线后照常执行 V1（脚本幂等，安全）
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 5s
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      # 正式接口已支持 1M 上下文 / 384K 输出；Beta 特性本项目未使用
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
          # 推理 token 也占输出预算；上限不等于实际用量，费用仍按实际 token 计
          max-tokens: 65536
server:
  port: 8124
  # 请求头上限：前端用 EventSource（SSE 只能 GET）把提示词放在查询串里，中文经 URL 编码后是 9 字节/字，
  # 默认 8KB 意味着超过约 900 个中文字符就在 Tomcat 解析阶段被拒（"Request header is too large"）——
  # 现象是前端发完需求一直没反馈、app 状态停在 not_generated（请求根本没进 Spring）。
  # 提到 64KB 后约可承载 7000 个中文字符，与前端输入框上限对齐后仍有富余。
  max-http-request-header-size: 64KB
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

# 可观测性：指标端点走独立端口 8125（不暴露在业务端口/公网）
# 访问：http://localhost:8125/actuator/prometheus
management:
  server:
    port: 8125
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      # 全局标签，多实例/多应用时便于区分
      application: xiaoyu-zerocode

# 代码生成文件临时目录与部署配置
codegen:
  node:
    # 默认使用 PATH 中与应用 Node 版本匹配的 npm shim；仅在离线定制环境显式开启。
    use-explicit-cli: ${CODEGEN_NODE_USE_EXPLICIT_CLI:false}
    corepack-command: ${CODEGEN_NODE_COREPACK_COMMAND:}
  model:
    routing:
      enabled: ${CODEGEN_MODEL_ROUTING_ENABLED:false}
    fallback:
      enabled: ${CODEGEN_MODEL_FALLBACK_ENABLED:false}
    resilience:
      enabled: ${CODEGEN_MODEL_RESILIENCE_ENABLED:true}
      failure-threshold: ${CODEGEN_MODEL_FAILURE_THRESHOLD:3}
      open-duration-ms: ${CODEGEN_MODEL_OPEN_DURATION_MS:30000}
      max-concurrent-calls: ${CODEGEN_MODEL_MAX_CONCURRENT_CALLS:8}
    default-model: deepseek-flash
    definitions:
      deepseek-flash:
        provider: deepseek
        model-name: ${CODEGEN_DEEPSEEK_MODEL:deepseek-flash}
        context-window: 128000
        max-output-tokens: 65536
        supports: [tools, vision, streaming, structured-output, reasoning]
        reasoning-style: deepseek-thinking
        enabled: true
    routes:
      generate: deepseek-flash
      repair: deepseek-flash
      modify: deepseek-flash
      vision-curate: deepseek-flash
      query-plan: deepseek-flash
      compress: deepseek-flash
      research: deepseek-flash
    fallbacks:
      deepseek-flash: []
  security:
    # Phase B 灰度开关：默认保留现有 Session/AOP 路径
    spring-security:
      enabled: ${CODEGEN_SPRING_SECURITY_ENABLED:false}
    csrf:
      enabled: ${CODEGEN_CSRF_ENABLED:false}
    cors:
      allowed-origins:
        - ${CODEGEN_CORS_ORIGIN_LOCAL:http://localhost:5199}
        - ${CODEGEN_CORS_ORIGIN_IP:http://127.0.0.1:5199}
  # Phase 1：持久化 Job 执行内核。默认数据库 Outbox，后续可替换 Redis Streams。
  jobs:
    # embedded：API 进程内执行；api：只跑控制面；worker：只消费并执行 Job
    execution-mode: ${CODEGEN_JOB_EXECUTION_MODE:embedded}
    worker-id: ${CODEGEN_JOB_WORKER_ID:${HOSTNAME:local-worker}}
    queue: ${CODEGEN_JOB_QUEUE:db}
    max-attempts: ${CODEGEN_JOB_MAX_ATTEMPTS:3}
    dispatch-delay-ms: ${CODEGEN_JOB_DISPATCH_DELAY_MS:1000}
    recovery-delay-ms: ${CODEGEN_JOB_RECOVERY_DELAY_MS:30000}
    quota:
      user-active-jobs: ${CODEGEN_JOB_USER_ACTIVE_LIMIT:2}
      max-queued-jobs: ${CODEGEN_JOB_MAX_QUEUE_DEPTH:1000}
    redis:
      stream: ${CODEGEN_JOB_REDIS_STREAM:codegen:generation-jobs}
      group: ${CODEGEN_JOB_REDIS_GROUP:generation-workers}
  generation-worker:
    consumer-concurrency: ${CODEGEN_WORKER_CONSUMER_CONCURRENCY:2}
    lease-seconds: ${CODEGEN_WORKER_LEASE_SECONDS:120}
    cancel-poll-millis: ${CODEGEN_WORKER_CANCEL_POLL_MILLIS:1000}
  sandbox:
    enabled: ${CODEGEN_SANDBOX_ENABLED:true}
    require-container: ${CODEGEN_SANDBOX_REQUIRE_CONTAINER:false}
    max-source-files: ${CODEGEN_SANDBOX_MAX_SOURCE_FILES:2000}
    max-source-bytes: ${CODEGEN_SANDBOX_MAX_SOURCE_BYTES:52428800}
    max-output-files: ${CODEGEN_SANDBOX_MAX_OUTPUT_FILES:10000}
    max-output-bytes: ${CODEGEN_SANDBOX_MAX_OUTPUT_BYTES:209715200}
    command-timeout-seconds: ${CODEGEN_SANDBOX_COMMAND_TIMEOUT_SECONDS:300}
    build:
      require-lockfile: ${CODEGEN_SANDBOX_REQUIRE_LOCKFILE:true}
      ignore-scripts: ${CODEGEN_SANDBOX_IGNORE_SCRIPTS:true}
      registry: ${CODEGEN_SANDBOX_NPM_REGISTRY:https://registry.npmmirror.com}
      allowed-packages: [vue, vite, "@vitejs/plugin-vue", typescript, vue-tsc, pinia, vue-router, axios, gsap]
    egress:
      allowed-hosts:
        - 127.0.0.1
        - localhost
        - yun-picture-1419359718.cos.ap-shanghai.myqcloud.com
        - images.pexels.com
        - cdn.pixabay.com
        - fonts.googleapis.com
        - fonts.gstatic.com
  file:
    tmp-root: ${CODEGEN_TMP_ROOT:D:\IDEAproject\xiaoyu_zerocode\tmp}
    deploy-root: ${CODEGEN_DEPLOY_ROOT:D:\IDEAproject\xiaoyu_zerocode\deploy}
    domain: ${CODEGEN_DOMAIN:http://localhost}
  # 交付前渲染验证（plan-agent-pipeline P0-4）：无头浏览器 3 档视口实拍检查图裂/横向溢出/空白页/console 报错
  verify:
    enabled: ${CODEGEN_VERIFY_ENABLED:true}
  browser:
    engine: ${CODEGEN_BROWSER_ENGINE:selenium}
    playwright:
      url: ${CODEGEN_PLAYWRIGHT_WORKER_URL:http://127.0.0.1:8090}
      transport: ${CODEGEN_PLAYWRIGHT_TRANSPORT:http}
      connect-timeout-ms: ${CODEGEN_PLAYWRIGHT_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${CODEGEN_PLAYWRIGHT_READ_TIMEOUT_MS:120000}
      redis:
        stream: ${CODEGEN_PLAYWRIGHT_REDIS_STREAM:codegen:browser-verify:requests}
        result-prefix: ${CODEGEN_PLAYWRIGHT_REDIS_RESULT_PREFIX:codegen:browser-verify:result:}
        poll-millis: ${CODEGEN_PLAYWRIGHT_REDIS_POLL_MILLIS:200}
  runtime:
    react-vite-ts:
      enabled: ${CODEGEN_RUNTIME_REACT_VITE_TS_ENABLED:false}
    next-static-export:
      enabled: ${CODEGEN_RUNTIME_NEXT_STATIC_EXPORT_ENABLED:false}
  # Agent 循环形态（S5）：true=自管循环（逐步预算真正生效）；false=框架内部循环（现状，默认）
  agent:
    self-managed-loop:
      enabled: ${CODEGEN_SELF_MANAGED_LOOP:false}
    # 单次生成的累计 token 预算（prompt+completion），超限在"轮次之间"拦下。
    # 默认 80 万：实测同一 prompt 在框架路径会烧到 46 万（单次调用总量），20 万会把自管循环的大页面提前掐断。
    max-loop-tokens: ${CODEGEN_MAX_LOOP_TOKENS:800000}
    # 上下文压缩 L1（历史里旧工具参数/结果换成占位）——实验特性，默认关闭。
    # 同 app 连续生成时实测反而更贵（模型改用 readFile 把文件读回来），需用全新 app 做控制变量实验后再定。
    context-slim:
      enabled: ${CODEGEN_CONTEXT_SLIM:false}
  blueprint:
    enabled: ${CODEGEN_PAGE_BLUEPRINT_ENABLED:true}
  # 四档推理滑杆：UI 只暴露 fast/eco/standard/max，reasoning_effort 只接受 low/high/max
  reasoning:
    default-level: standard
    profiles:
      fast:
        thinking-enabled: false
        effort:
        max-steps: 8
        max-loop-tokens: 200000
        repair-rounds: 1
        max-output-tokens: 32768
        model: deepseek-flash
      eco:
        thinking-enabled: true
        effort: low
        max-steps: 12
        max-loop-tokens: 400000
        repair-rounds: 1
        max-output-tokens: 32768
        model: deepseek-flash
      standard:
        thinking-enabled: true
        effort: high
        max-steps: 20
        max-loop-tokens: 800000
        repair-rounds: 2
        max-output-tokens: 65536
        model: deepseek-flash
      max:
        thinking-enabled: true
        effort: max
        max-steps: 30
        max-loop-tokens: 1200000
        repair-rounds: 3
        max-output-tokens: 65536
        model: deepseek-flash
  memory:
    # 原始记忆窗口预算；超过压缩阈值的较早对话会被模型摘要，最近 4 轮保持原文
    context-token-budget: 16000
    compression:
      enabled: ${CODEGEN_CONTEXT_COMPRESSION_ENABLED:true}
      min-tokens: ${CODEGEN_CONTEXT_COMPRESSION_MIN_TOKENS:8000}
      keep-recent-rounds: ${CODEGEN_CONTEXT_COMPRESSION_KEEP_ROUNDS:4}
      max-output-tokens: ${CODEGEN_CONTEXT_COMPRESSION_MAX_OUTPUT_TOKENS:1500}
  web-research:
    # 默认关闭；开启后 searchWeb/fetchWeb 才会出现在 Agent 工具列表中
    enabled: ${CODEGEN_WEB_RESEARCH_ENABLED:false}
    provider: ${CODEGEN_WEB_RESEARCH_PROVIDER:deepseek}
    max-results: ${CODEGEN_WEB_RESEARCH_MAX_RESULTS:5}
    max-content-chars: ${CODEGEN_WEB_RESEARCH_MAX_CONTENT_CHARS:6000}
    cache-ttl-seconds: ${CODEGEN_WEB_RESEARCH_CACHE_TTL_SECONDS:3600}
    qps: ${CODEGEN_WEB_RESEARCH_QPS:5}
  materials:
    curator:
      enabled: ${CODEGEN_MATERIALS_CURATOR_ENABLED:true}

# 封面截图配置（默认值，实际按环境在 profile 文件中覆盖）
screenshot:
  browser: edge
  driver-path:
  headless: true
  width: 1440
  height: 900
  wait-millis: 5000
  original-folder: app-cover/original
  compressed-folder: app-cover/compressed
  compressed-width: 480
# 封面截图线程池默认参数
thread-pool:
  screenshot:
    core-pool-size: 1
    max-pool-size: 2
    keep-alive-seconds: 60
    queue-capacity: 50
    thread-name-prefix: "screenshot-"

# Pexels 图库 API 默认配置（key 在 profile 文件中按环境配置）
pexels:
  api-key:
  page-size: 5

# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mofanyi.controller
