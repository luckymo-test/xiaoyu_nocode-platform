spring:
  application:
    name: xiaoyuZeroCode
  profiles:
    active: location
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 5s
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      # 用 beta 接口以支持 8K 输出上限（非 beta 只认 4K，复杂页面会截断）
      base-url: https://api.deepseek.com/beta
      chat:
        options:
          model: deepseek-chat
          # 调大输出上限，避免长 HTML 被截断导致 JSON 解析失败
          max-tokens: 8192
server:
  port: 8124
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# 代码生成文件临时目录与部署配置
codegen:
  file:
    tmp-root: D:\IDEAproject\xiaoyu_zerocode\tmp
    deploy-root: D:\IDEAproject\xiaoyu_zerocode\deploy
    domain: http://localhost

# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mofanyi.controller

