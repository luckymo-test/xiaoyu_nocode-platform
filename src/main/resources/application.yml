spring:
  application:
    name: xiaoyuZeroCode
  profiles:
    active: location
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 5s
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      # 用 beta 接口以支持 8K 输出上限（非 beta 只认 4K，复杂页面会截断）
      base-url: https://api.deepseek.com/beta
      chat:
        options:
          model: deepseek-v4-flash
          # 调大输出上限，避免长 HTML 被截断导致 JSON 解析失败
          max-tokens: 8192
server:
  port: 8124
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# 代码生成文件临时目录与部署配置
codegen:
  file:
    tmp-root: ${CODEGEN_TMP_ROOT:D:\IDEAproject\xiaoyu_zerocode\tmp}
    deploy-root: ${CODEGEN_DEPLOY_ROOT:D:\IDEAproject\xiaoyu_zerocode\deploy}
    domain: ${CODEGEN_DOMAIN:http://localhost}

# 封面截图配置（默认值，实际按环境在 profile 文件中覆盖）
screenshot:
  browser: edge
  driver-path:
  headless: true
  width: 1440
  height: 900
  wait-millis: 5000
  original-folder: app-cover/original
  compressed-folder: app-cover/compressed
  compressed-width: 480
# 封面截图线程池默认参数
thread-pool:
  screenshot:
    core-pool-size: 1
    max-pool-size: 2
    keep-alive-seconds: 60
    queue-capacity: 50
    thread-name-prefix: "screenshot-"

# Pexels 图库 API 默认配置（key 在 profile 文件中按环境配置）
pexels:
  api-key:
  page-size: 5

# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mofanyi.controller

