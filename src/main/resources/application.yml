spring:
  application:
    name: xiaoyuZeroCode
  profiles:
    active: location
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 5s
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      # 用 beta 接口以支持 8K 输出上限（非 beta 只认 4K，复杂页面会截断）
      base-url: https://api.deepseek.com/beta
      chat:
        options:
          model: deepseek-v4-flash
          # 调大输出上限：deepseek-v4-flash 是推理模型，推理 token 也占输出预算，
          # 8192/16384 下过度思考或写大文件时仍会截断；32768 已实测 beta 接口接受
          max-tokens: 32768
server:
  port: 8124
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# 可观测性：指标端点走独立端口 8125（不暴露在业务端口/公网）
# 访问：http://localhost:8125/actuator/prometheus
management:
  server:
    port: 8125
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      # 全局标签，多实例/多应用时便于区分
      application: xiaoyu-zerocode

# 代码生成文件临时目录与部署配置
codegen:
  file:
    tmp-root: ${CODEGEN_TMP_ROOT:D:\IDEAproject\xiaoyu_zerocode\tmp}
    deploy-root: ${CODEGEN_DEPLOY_ROOT:D:\IDEAproject\xiaoyu_zerocode\deploy}
    domain: ${CODEGEN_DOMAIN:http://localhost}
  # 交付前渲染验证（plan-agent-pipeline P0-4）：无头浏览器 3 档视口实拍检查图裂/横向溢出/空白页/console 报错
  verify:
    enabled: ${CODEGEN_VERIFY_ENABLED:true}
  # Agent 循环形态（S5）：true=自管循环（逐步预算真正生效）；false=框架内部循环（现状，默认）
  agent:
    self-managed-loop:
      enabled: ${CODEGEN_SELF_MANAGED_LOOP:false}
    # 单次生成的累计 token 预算（prompt+completion），超限在"轮次之间"拦下。
    # 默认 80 万：实测同一 prompt 在框架路径会烧到 46 万（单次调用总量），20 万会把自管循环的大页面提前掐断。
    max-loop-tokens: ${CODEGEN_MAX_LOOP_TOKENS:800000}

# 封面截图配置（默认值，实际按环境在 profile 文件中覆盖）
screenshot:
  browser: edge
  driver-path:
  headless: true
  width: 1440
  height: 900
  wait-millis: 5000
  original-folder: app-cover/original
  compressed-folder: app-cover/compressed
  compressed-width: 480
# 封面截图线程池默认参数
thread-pool:
  screenshot:
    core-pool-size: 1
    max-pool-size: 2
    keep-alive-seconds: 60
    queue-capacity: 50
    thread-name-prefix: "screenshot-"

# Pexels 图库 API 默认配置（key 在 profile 文件中按环境配置）
pexels:
  api-key:
  page-size: 5

# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mofanyi.controller
