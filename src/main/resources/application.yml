spring:
  application:
    name: xiaoyuZeroCode
  profiles:
    active: location
  # 开放更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 10MB
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 5s
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8124
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mofanyi.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

